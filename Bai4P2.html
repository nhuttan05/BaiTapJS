<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        
        const bills = [
            22, 295, 176, 440, 37, 105, 10, 1100, 86, 52
        ]
        const tips = []
        const totals = []

        function calcTip (bill) {
            var tip = 0;
            if (bill >= 50 && bill <= 300) {
                tip = bill * (15 / 100);
            } else {
                tip = bill * (20 / 100);
            }
            return tip;
        }

        for (let i = 0; i < bills.length; i++) {
            tips.push(calcTip(bills[i]));
            totals.push(bills[i] + tips[i]);
        }

        console.log(bills);
        console.log(tips);
        console.log(totals);

        function calcAverage (arr) {
            let sum = 0;
            for (let i = 0; i < arr.length; i++) {
                sum += arr[i];
            }
            return sum / arr.length;
        }

        console.log('Average of totals bills is: ' + calcAverage(totals));
    </script>
</body>
</html>
