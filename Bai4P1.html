<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <input type="text" id="bill" placeholder="Hoa Don">
    
    <button id="click">click</button>

    <script>
        var button = document.getElementById('click');
        
        button.onclick = () => {
            var bill = parseFloat(document.getElementById('bill').value);
            var totals = 0;
            var tips = 0;
            var detailtals = 0;
            if (bill >= 50 && bill <= 300) {    
                tips = 15/100;
                totals = bill * tips;
                console.log('The bill was ' + bill + ', the tip was ' + totals + ', and the total value ' + (totals + bill));
            } else {
                tips = 20/100;
                totals = bill * tips;
                console.log('The bill was ' + bill + ', the tip was ' + totals + ', and the total value ' + (totals + bill));
            }
        }
    </script>
</body>
</html>
