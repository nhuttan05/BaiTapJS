<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        const gameEvents = new Map([
            [17, '⚽ GOAL'],
            [36, '🔁 Substitution'],
            [47, '⚽ GOAL'],
            [61, '🔁 Substitution'],
            [64, '🔶 Yellow card'],
            [69, '🔴 Red card'],
            [70, '🔁 Substitution'],
            [72, '🔁 Substitution'],
            [76, '⚽ GOAL'],
            [80, '⚽ GOAL'],
            [92, '🔶 Yellow card'],
        ]);
        const events = [...new Set(gameEvents.values())];
        console.log('- Unique events: ' + events.join(', '));

        console.log('- Delete yellow card at 64 minutes from the game events log: ', gameEvents.delete(64));
        console.log(`- An event happened, on average, every ${90 / gameEvents.size} minutes`);
        
        for (const [minute, event] of gameEvents) {
            const half = minute <= 45 ? 'FIRST' : 'SECOND';
            console.log(`[${half} HALF] ${minute}: ${event}`);
        }
    </script>
</body>
</html>
